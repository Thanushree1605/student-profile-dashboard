
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 id="pageTitle">Student Management Dashboard</h1>
        <p>Manage student profiles and learning progress</p>
    </header>

    <main>
        <section class="summary">
            <h2>Total Students</h2>
            <p id="studentCount">0</p>
        </section>

        <section class="notice">
            <p id="welcomeMessage">Welcome to the Student Dashboard!</p>
        </section>

        <section>
            <h2>Student Profiles</h2>
            <div id="profileContainer" class="student-container"></div>
        </section>
    </main>

    <footer>
        <p>Student Profile Management Dashboard</p>
    </footer>
</body>
</html>
